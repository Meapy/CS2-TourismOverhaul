<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Hotels zone icon.

    Drawn to match the game's own zone icons: a 32x32 canvas, a 2:1 isometric ground plate in the
    commercial blue, and a building in the stock palette (cream roof #faf7ec, lit face #e4d8b3,
    shaded face #0071a9, windows #03243e / #001209, highlights #73e0fc).

    Reads as a hotel rather than generic high-density commercial through the tall stacked window
    bands, the vertical sign on the shaded face, and the porte-cochere canopy at the entrance.
  -->
  <g id="ZoneTourismOverhaulHotels">
    <path id="plate" d="M1.5,18 L16,25.5 L30.5,18 L16,10.5 Z" fill="#00c1ff"/>

    <path id="roof" d="M16,2 L24,6 L16,10 L8,6 Z" fill="#faf7ec"/>
    <path id="face-left" d="M8,6 L16,10 L16,21 L8,17 Z" fill="#e4d8b3"/>
    <path id="face-right" d="M16,10 L24,6 L24,17 L16,21 Z" fill="#0071a9"/>

    <g id="windows-left" fill="#03243e">
      <path d="M8,8 L16,12 L16,13.5 L8,9.5 Z"/>
      <path d="M8,11 L16,15 L16,16.5 L8,12.5 Z"/>
      <path d="M8,14 L16,18 L16,19.5 L8,15.5 Z"/>
    </g>

    <g id="windows-right" fill="#001209">
      <path d="M16,12 L24,8 L24,9.5 L16,13.5 Z"/>
      <path d="M16,15 L24,11 L24,12.5 L16,16.5 Z"/>
      <path d="M16,18 L24,14 L24,15.5 L16,19.5 Z"/>
    </g>

    <path id="sign" d="M17,11 L18.2,10.4 L18.2,16.9 L17,17.5 Z" fill="#faf7ec"/>
    <path id="canopy" d="M12.5,19 L16,20.75 L19.5,19 L16,17.25 Z" fill="#73e0fc"/>
  </g>
</svg>
