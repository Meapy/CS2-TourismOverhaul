<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Motels zone icon.

    Same canvas, plate and palette as the Hotels icon so the two read as a pair, but the silhouette
    is deliberately opposite: long and low rather than tall and narrow. The two rows of doors opening
    onto an external walkway and the roadside pole sign are the details that say "motel" at 32px.
  -->
  <g id="ZoneTourismOverhaulMotels">
    <path id="plate" d="M1.5,18 L16,25.5 L30.5,18 L16,10.5 Z" fill="#00c1ff"/>

    <g id="pole-sign">
      <path d="M2.9,8.8 L3.9,8.8 L3.9,19 L2.9,19 Z" fill="#b3a887"/>
      <path d="M1.2,4 L5.6,4 L5.6,8.8 L1.2,8.8 Z" fill="#73e0fc"/>
      <path d="M2,4.8 L4.8,4.8 L4.8,8 L2,8 Z" fill="#03243e"/>
    </g>

    <path id="roof" d="M13,5 L25,11 L18,14.5 L6,8.5 Z" fill="#faf7ec"/>
    <path id="face-left" d="M6,8.5 L18,14.5 L18,20.5 L6,14.5 Z" fill="#e4d8b3"/>
    <path id="face-right" d="M18,14.5 L25,11 L25,17 L18,20.5 Z" fill="#0071a9"/>

    <g id="doors-upper" fill="#03243e">
      <path d="M7.68,10.14 L8.88,10.74 L8.88,12.54 L7.68,11.94 Z"/>
      <path d="M10.08,11.34 L11.28,11.94 L11.28,13.74 L10.08,13.14 Z"/>
      <path d="M12.48,12.54 L13.68,13.14 L13.68,14.94 L12.48,14.34 Z"/>
      <path d="M14.88,13.74 L16.08,14.34 L16.08,16.14 L14.88,15.54 Z"/>
    </g>

    <path id="walkway" d="M6.72,11.46 L17.28,16.74 L17.28,17.54 L6.72,12.26 Z" fill="#b3a887"/>

    <g id="doors-lower" fill="#03243e">
      <path d="M7.68,12.74 L8.88,13.34 L8.88,15.14 L7.68,14.54 Z"/>
      <path d="M10.08,13.94 L11.28,14.54 L11.28,16.34 L10.08,15.74 Z"/>
      <path d="M12.48,15.14 L13.68,15.74 L13.68,17.54 L12.48,16.94 Z"/>
      <path d="M14.88,16.34 L16.08,16.94 L16.08,18.74 L14.88,18.14 Z"/>
    </g>

    <path id="window-right" d="M20.1,15.45 L21.85,14.575 L21.85,16.575 L20.1,17.45 Z" fill="#001209"/>
  </g>
</svg>
