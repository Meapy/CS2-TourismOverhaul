<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Paradox Mods thumbnail.

    Built from the same isometric language as the in-game zone icons (ui/src/images), scaled up:
    the hotel tower and the motel with its roadside pole sign, on commercial-blue zone plates.
    That makes the store listing and the zoning toolbar recognisably the same mod.

    Composition is silhouette-first because Paradox renders this small — the tall tower against the
    long low block stays readable when the window bands and doors have blurred away. The green wash
    is city attractiveness, the cyan rings are the tourist markers, and the plane and ferry are the
    headline fix: visitors arriving by air and sea.

    The scene sits in the upper two thirds so the wordmark has clear space rather than being laid
    over the artwork. Arial is named explicitly because this is rasterised through a browser canvas
    by make-thumbnail.html, where a generic sans-serif would vary by machine.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12313f"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <ellipse cx="256" cy="286" rx="190" ry="86" fill="#3ddc84" opacity="0.16"/>

  <g fill="none" stroke="#8fe9f5" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M40 112 Q146 40 264 92" stroke-dasharray="26 20"/>
    <path d="M498 396 Q452 348 402 344" stroke-dasharray="20 16"/>
  </g>

  <g transform="translate(54 118) rotate(26)" fill="#ffffff">
    <path d="M0 0 L44 -11 L55 -4 L21 11 L10 32 L2 30 L6 11 L-13 17 L-17 9 Z"/>
  </g>

  <g transform="translate(384 340) scale(1.35)" fill="#ffffff">
    <rect x="-5" y="-28" width="8" height="24" rx="3"/>
