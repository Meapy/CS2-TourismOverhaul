<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12313f"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd6e8"/>
      <stop offset="1" stop-color="#1d9fc4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6f8f"/>
      <stop offset="1" stop-color="#0d3b52"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- attractiveness glow behind the city -->
  <ellipse cx="256" cy="330" rx="190" ry="90" fill="#3ddc84" opacity="0.16"/>

  <!-- water band -->
  <path d="M0 372 Q128 352 256 372 T512 372 L512 512 L0 512 Z" fill="url(#water)" opacity="0.85"/>

  <!-- skyline -->
  <g fill="#0e2836" opacity="0.95">
    <rect x="120" y="268" width="34" height="106" rx="4"/>
    <rect x="162" y="238" width="30" height="136" rx="4"/>
    <rect x="200" y="288" width="28" height="86" rx="4"/>
    <rect x="284" y="256" width="32" height="118" rx="4"/>
    <rect x="324" y="298" width="26" height="76" rx="4"/>
    <rect x="358" y="272" width="34" height="102" rx="4"/>
  </g>

  <!-- suitcase -->
  <g transform="translate(256 232)">
    <rect x="-26" y="-96" width="52" height="26" rx="10" fill="none" stroke="#8fe9f5" stroke-width="13"/>
    <rect x="-92" y="-74" width="184" height="132" rx="22" fill="url(#case)"/>
    <rect x="-92" y="-74" width="184" height="132" rx="22" fill="none" stroke="#bff3fb" stroke-width="7" opacity="0.85"/>
    <rect x="-12" y="-74" width="24" height="132" fill="#0e2836" opacity="0.32"/>
  </g>

  <!-- arrival arcs: plane and ship converging on the city -->
  <g fill="none" stroke="#8fe9f5" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <path d="M56 150 Q150 96 236 150" stroke-dasharray="26 20"/>
    <path d="M456 150 Q362 96 276 150" stroke-dasharray="26 20"/>
  </g>

  <!-- plane -->
  <g transform="translate(70 156) rotate(28)" fill="#ffffff">
    <path d="M0 0 L46 -12 L58 -4 L22 12 L10 34 L2 32 L6 12 L-14 18 L-18 10 Z"/>
  </g>

  <!-- ship -->
  <g transform="translate(414 152)" fill="#ffffff">
    <rect x="-6" y="-30" width="9" height="26" rx="3"/>
    <path d="M-34 -4 L34 -4 L22 20 L-22 20 Z"/>
  </g>
</svg>
